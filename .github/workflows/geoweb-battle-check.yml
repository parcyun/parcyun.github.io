name: Check GeoWeb battle

on:
  pull_request:
    paths:
      - 'src/components/GeoBattle.jsx'
      - 'src/components/geoBattle.css'
      - 'src/components/ConquestGeoGame.jsx'
      - 'src/components/ConquestGlobe.jsx'
      - 'server/geoweb-battle/**'
      - 'scripts/build-geoweb-battle-corpus.mjs'
      - 'test/geoweb-battle-engine.test.mjs'
      - '.github/workflows/geoweb-battle-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-geoweb-battle-corpus.mjs && git diff --exit-code -- server/geoweb-battle/corpus.json
      - run: node --test test/geoweb-battle-engine.test.mjs
      - run: npm run build
      - run: docker build -f server/geoweb-battle/Dockerfile .
