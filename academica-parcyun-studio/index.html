<style>
:root {
  --ps-primary:                  #FFB11A;
  --ps-primary-dark:             #E89500;
  --ps-bg-cinematic:             #000000;
  --ps-surface-cinematic-1:      #141414;
  --ps-surface-cinematic-3:      #333333;
  --ps-text-cinematic-secondary: #8C8C8C;
  --ps-font-body: 'Pretendard Variable','Pretendard','Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
  --ps-font-en:   'Montserrat','Pretendard Variable','Pretendard',sans-serif;
  --ps-font-signature: 'Covered By Your Grace', cursive;
  --ps-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--ps-bg-cinematic);
  color: #FFFFFF;
  font-family: var(--ps-font-body);
  font-weight: 300;
  line-height: 1.6;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
</style>
<style>
.ps-back {
  position: fixed; top: 20px; left: 24px;
  font-family: var(--ps-font-en); font-size: 12px; font-weight: 400;
  letter-spacing: 0.5px; color: var(--ps-text-cinematic-secondary);
  z-index: 90; transition: color 240ms var(--ps-ease-out);
  display: flex; align-items: center; gap: 6px;
}
.ps-back:hover { color: var(--ps-primary); }

.wrap { max-width: 1108px; margin: 0 auto; padding: 0 24px; }
@media (min-width: 768px) { .wrap { padding: 0 48px; } }
section { padding: 96px 0; }
@media (min-width: 768px) { section { padding: 120px 0; } }

.hero {
  min-height: 60vh; display: flex; flex-direction: column;
  justify-content: center; padding: 120px 24px 80px;
}
@media (min-width: 768px) { .hero { padding: 140px 48px 80px; } }
.hero-inner { max-width: 1108px; margin: 0 auto; width: 100%; }
.hero-eyebrow {
  font-family: var(--ps-font-en); font-size: 12px; font-weight: 400;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--ps-primary); margin-bottom: 28px;
}
.hero-title {
  font-size: clamp(40px, 8vw, 96px); font-weight: 300;
  letter-spacing: -2px; line-height: 1.1; margin: 0 0 24px; color: #FFFFFF;
}
.hero-title strong { font-weight: 600; color: var(--ps-primary); }
.hero-sub {
  font-family: var(--ps-font-en); font-size: 13px; font-weight: 300;
  letter-spacing: 1px; color: var(--ps-text-cinematic-secondary);
}

.section-header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 48px; }
@media (min-width: 768px) { .section-header { flex-direction: row; align-items: baseline; gap: 16px; } }
.section-header .ko {
  font-size: clamp(28px, 4vw, 40px); font-weight: 300;
  letter-spacing: -1.2px; line-height: 1.2; margin: 0; color: #FFFFFF;
}
.section-header .en {
  font-family: var(--ps-font-en); font-size: 12px; font-weight: 400;
  letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--ps-text-cinematic-secondary);
}
</style>
<style>
.video-grid {
  display: grid; grid-template-columns: 1fr; gap: 24px;
}
@media (min-width: 640px) { .video-grid { grid-template-columns: repeat(2, 1fr); gap: 28px; } }
@media (min-width: 1024px) { .video-grid { grid-template-columns: repeat(3, 1fr); } }

.video-placeholder {
  border: 1px dashed rgba(255,255,255,0.12); border-radius: 16px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 260px;
  padding: 32px 24px; gap: 12px; text-align: center;
}
.video-placeholder .topic {
  font-size: 16px; font-weight: 400; letter-spacing: -0.3px;
  color: #FFFFFF; margin: 0; line-height: 1.4; word-break: keep-all;
}
.video-placeholder .cs-label {
  font-family: var(--ps-font-en); font-size: 10px; font-weight: 500;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--ps-text-cinematic-secondary);
}
.section-divider { border: none; border-top: 1px solid var(--ps-surface-cinematic-3); margin: 0; }

/* Real video card */
.video-card {
  display: block; border: 1px solid var(--ps-surface-cinematic-3);
  border-radius: 16px; overflow: hidden; color: #FFFFFF; text-decoration: none;
  transition: border-color 320ms var(--ps-ease-out), transform 320ms var(--ps-ease-out);
}
.video-card:hover { border-color: var(--ps-primary); transform: translateY(-4px); }
.video-card-thumb {
  position: relative; aspect-ratio: 16/9;
  background: var(--ps-surface-cinematic-1); overflow: hidden;
}
.video-card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 400ms var(--ps-ease-out); }
.video-card:hover .video-card-thumb img { transform: scale(1.03); }
.video-card-play {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.35); transition: background 240ms var(--ps-ease-out);
}
.video-card:hover .video-card-play { background: rgba(0,0,0,0.15); }
.video-card-play svg { width: 56px; height: 56px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }
.video-card-body { padding: 20px 24px 24px; background: var(--ps-bg-cinematic); }
.video-card-meta {
  font-family: var(--ps-font-en); font-size: 11px; font-weight: 400;
  letter-spacing: 1px; color: var(--ps-primary); margin-bottom: 10px;
}
.video-card-title { font-size: 17px; font-weight: 500; letter-spacing: -0.4px; margin: 0 0 10px; color: #FFFFFF; line-height: 1.4; }
.video-card-desc { font-size: 13px; font-weight: 300; line-height: 1.6; color: var(--ps-text-cinematic-secondary); margin: 0; }

.ps-footer {
  position: fixed; bottom: 16px; right: 20px;
  font-family: var(--ps-font-en); font-weight: 300; font-size: 11px;
  color: var(--ps-text-cinematic-secondary);
  display: flex; align-items: center; gap: 8px; z-index: 9999;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px); padding: 6px 12px;
  border-radius: 100px; border: 1px solid rgba(255,255,255,0.08);
}
.ps-signature { font-family: var(--ps-font-signature); font-size: 15px; color: var(--ps-primary); line-height: 1; }
.ps-ig { display: inline-flex; align-items: center; gap: 3px; color: inherit; margin-left: 4px; }
.ps-ig:hover { color: var(--ps-primary); }
.ps-ig-icon { width: 10px; height: 10px; vertical-align: middle; }

section, .hero { opacity: 0; transform: translateY(24px); transition: opacity 800ms var(--ps-ease-out), transform 800ms var(--ps-ease-out); }
section.in-view, .hero.in-view { opacity: 1; transform: none; }
.hero { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } section, .hero { opacity: 1; transform: none; transition: none; } }
</style>

<script>
(function(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('section').forEach(function(el){ el.classList.add('in-view'); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -15% 0px', threshold: 0.05 });
  document.querySelectorAll('section').forEach(function(el){ io.observe(el); });
})();
</script>
