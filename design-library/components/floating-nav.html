<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Nav · parcyun studio design library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
:root {
  --ps-primary: #FFB11A;
  --ps-bg-cinematic: #000000;
  --ps-text-cinematic-secondary: #8C8C8C;
  --ps-surface-cinematic-3: #333333;
  --ps-font-en: 'Montserrat', 'Pretendard Variable', sans-serif;
  --ps-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ps-bg-cinematic); color: #FFFFFF;
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif; font-weight: 300; line-height: 1.6;
  -webkit-font-smoothing: antialiased; min-height: 100vh; padding: 100px 24px;
}
a { color: inherit; text-decoration: none; }
.demo-header { position: fixed; top: 16px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; z-index: 90; pointer-events: none; }
.demo-header > * { pointer-events: auto; }
.demo-back { font-family: var(--ps-font-en); font-size: 12px; letter-spacing: 0.5px; color: var(--ps-text-cinematic-secondary); transition: color 240ms var(--ps-ease-out); }
.demo-back:hover { color: var(--ps-primary); }
.demo-label { font-family: var(--ps-font-en); font-size: 10px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ps-primary); border: 1px solid var(--ps-primary); padding: 5px 12px 6px; border-radius: 100px; }
.demo-wrap { max-width: 800px; margin: 0 auto; }
.variant-label { font-family: var(--ps-font-en); font-size: 10px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--ps-text-cinematic-secondary); margin-bottom: 16px; }
.demo-stage { position: relative; height: 220px; border: 1px solid var(--ps-surface-cinematic-3); border-radius: 16px; background: #0A0A0A; }
.usage-hint { margin-top: 48px; padding: 32px; border: 1px dashed rgba(255,255,255,0.15); border-radius: 16px; }
.usage-hint h3 { font-family: var(--ps-font-en); font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--ps-primary); margin: 0 0 16px; }
.usage-hint pre { background: #141414; border-radius: 8px; padding: 20px; overflow-x: auto; margin: 0; }
.usage-hint code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; color: var(--ps-text-cinematic-secondary); white-space: pre; }

/* ===========================================================
   ⚡ COMPONENT: Floating Nav  (top / bottom 이동)
   우측 세로 중앙 고정. 페이지 맨 위/아래로 부드럽게 스크롤.
   =========================================================== */
.float-nav {
  position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 80;
}
.float-nav button {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.12); color: #FFFFFF;
  font-family: var(--ps-font-en); font-size: 14px; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 240ms var(--ps-ease-out), color 240ms var(--ps-ease-out), transform 240ms var(--ps-ease-out);
}
.float-nav button:hover { border-color: var(--ps-primary); color: var(--ps-primary); transform: translateY(-2px); }
/* === END COMPONENT === */
</style>
</head>
<body>

<div class="demo-header">
  <a class="demo-back" href="../index.html">← Design Library</a>
  <span class="demo-label">Component Preview</span>
</div>

<div class="demo-wrap">
  <p class="variant-label">Fixed right-center · ↑ / ↓</p>
  <div class="demo-stage">
    <!-- ⚡⚡⚡ COMPONENT MARKUP ⚡⚡⚡ -->
    <div class="float-nav" aria-label="페이지 이동">
      <button type="button" aria-label="맨 위로">↑</button>
      <button type="button" aria-label="맨 아래로">↓</button>
    </div>
    <!-- ⚡⚡⚡ END COMPONENT MARKUP ⚡⚡⚡ -->
  </div>

  <div class="usage-hint">
    <h3>Usage</h3>
    <pre><code>&lt;div class="float-nav" aria-label="페이지 이동"&gt;
  &lt;button onclick="scrollTo({top:0,behavior:'smooth'})"&gt;↑&lt;/button&gt;
  &lt;button onclick="scrollTo({top:document.body.scrollHeight,behavior:'smooth'})"&gt;↓&lt;/button&gt;
&lt;/div&gt;</code></pre>
  </div>
</div>
</body>
</html>
