<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Button · parcyun studio design library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&family=JetBrains+Mono:wght@400;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
:root {
  --ps-primary: #FFB11A;
  --ps-primary-dark: #E89500;
  --ps-bg-cinematic: #000000;
  --ps-text-cinematic-secondary: #8C8C8C;
  --ps-surface-cinematic-3: #333333;
  --ps-font-body: 'Pretendard Variable', 'Pretendard', 'Montserrat', sans-serif;
  --ps-font-en: 'Montserrat', 'Pretendard Variable', sans-serif;
  --ps-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ps-bg-cinematic); color: #FFFFFF;
  font-family: var(--ps-font-body); font-weight: 300; line-height: 1.6;
  word-break: keep-all; -webkit-font-smoothing: antialiased;
  min-height: 100vh; padding: 100px 24px;
}
@media (min-width: 768px) { body { padding: 100px 48px; } }
a { color: inherit; text-decoration: none; }
.demo-header { position: fixed; top: 16px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; z-index: 90; pointer-events: none; }
.demo-header > * { pointer-events: auto; }
.demo-back { font-family: var(--ps-font-en); font-size: 12px; letter-spacing: 0.5px; color: var(--ps-text-cinematic-secondary); transition: color 240ms var(--ps-ease-out); }
.demo-back:hover { color: var(--ps-primary); }
.demo-label { font-family: var(--ps-font-en); font-size: 10px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ps-primary); border: 1px solid var(--ps-primary); padding: 5px 12px 6px; border-radius: 100px; }
.demo-wrap { max-width: 800px; margin: 0 auto; }
.demo-block { margin-bottom: 48px; }
.variant-label { font-family: var(--ps-font-en); font-size: 10px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--ps-text-cinematic-secondary); margin-bottom: 16px; }
.demo-stage { position: relative; height: 160px; border: 1px solid var(--ps-surface-cinematic-3); border-radius: 16px; background: #0A0A0A; }

/* ===========================================================
   ⚡ COMPONENT: Share Button
   우측 하단 고정 FAB. 클릭 시 기기 네이티브 공유 시트(Web Share).
   미지원 시 링크 복사 폴백.
   =========================================================== */
.ps-share-wrap {
  position: absolute; right: 20px; bottom: 20px; z-index: 80;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
}
.ps-share-fab {
  display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border: 0;
  border-radius: 100px; cursor: pointer; background: var(--ps-primary); color: #000; font-weight: 700;
  font-size: 13px; letter-spacing: -.01em; font-family: var(--ps-font-body);
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
  transition: transform .22s var(--ps-ease-out), box-shadow .22s var(--ps-ease-out), background .18s;
}
.ps-share-fab:hover { background: var(--ps-primary-dark); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,.45), 0 0 24px rgba(255,177,26,.35); }
.ps-share-fab svg { width: 16px; height: 16px; flex: 0 0 auto; }
/* === END COMPONENT === */

.usage-hint { margin-top: 64px; padding: 32px; border: 1px dashed rgba(255,255,255,0.15); border-radius: 16px; }
.usage-hint h3 { font-family: var(--ps-font-en); font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--ps-primary); margin: 0 0 16px; }
.usage-hint pre { background: #141414; border-radius: 8px; padding: 20px; overflow-x: auto; margin: 0 0 16px; }
.usage-hint code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; color: var(--ps-text-cinematic-secondary); white-space: pre; }
.usage-hint p { font-size: 13px; color: var(--ps-text-cinematic-secondary); margin: 0; }
</style>
</head>
<body>

<div class="demo-header">
  <a class="demo-back" href="../index.html">← Design Library</a>
  <span class="demo-label">Component Preview</span>
</div>

<div class="demo-wrap">

<div class="demo-block">
  <p class="variant-label">Fixed bottom-right · FAB</p>
  <div class="demo-stage">
    <!-- ⚡⚡⚡ COMPONENT MARKUP ⚡⚡⚡ -->
    <div class="ps-share-wrap">
      <button class="ps-share-fab" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
          <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
        </svg>
        <span>쌤 동료에게 공유하기</span>
      </button>
    </div>
    <!-- ⚡⚡⚡ END COMPONENT MARKUP ⚡⚡⚡ -->
  </div>
</div>

<div class="usage-hint">
  <h3>Usage</h3>
  <pre><code>&lt;!-- 자동 주입: 페이지에 아래 한 줄만 추가 --&gt;
&lt;script src="/share-widget.js" defer&gt;&lt;/script&gt;</code></pre>
  <p>클릭 시 <code>navigator.share()</code>(모바일) 또는 링크 복사(데스크톱). ≤430px에선 아이콘만 남긴 원형 FAB로 축소. 고정 푸터가 있으면 자동으로 위로 오프셋.</p>
</div>

</div>
</body>
</html>
