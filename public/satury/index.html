 status.querySelector('span:last-child').textContent='결과를 표시하고 있어요…';
 if(notice)await reveal(out,'p',notice+(hit?' 저장된 국립국어원 자료를 표시합니다.':' 저장된 자료에서도 찾지 못했어요.'),id);
 if(id!==sequence)return;
 if(!hit){
  if(!notice)await reveal(out,'p','이 표준어에 해당하는 지역어를 찾지 못했어요.',id);
 }else{
  await reveal(out,'h1',q,id);
  let rowCount=0;
  for(const [region,rows] of Object.entries(hit.groups)){
   if(id!==sequence)return;
   const card=add(out,'article','');await reveal(card,'h2',region,id);
   for(const row of rows){
    if(id!==sequence)return;
    // Bound long answers: preserve order, drain the remaining text promptly.
    if(++rowCount>24||reduced.matches||document.hidden)add(card,'p',row);
    else await reveal(card,'p',row,id);
   }
  }
  if(id!==sequence)return;
  const source=add(out,'a','국립국어원 원자료');
  try{const url=new URL(hit.url);if(url.protocol==='https:'&&(url.hostname==='korean.go.kr'||url.hostname.endsWith('.korean.go.kr')))source.href=url.href;}catch{}
 }
 if(id!==sequence)return;
 setBusy(false,hit?Object.keys(hit.groups).length+'개 지역의 방언을 찾았어요.':'검색을 마쳤어요.');
 recommend(q);
};
