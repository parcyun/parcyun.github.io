<style>
:root{
  --ps-primary:#FFB11A; --ps-primary-dark:#E89500;
  --bg:#04060B; --surface-1:#101319; --surface-2:#191D26; --border:#2A2F3A;
  --text:#FFFFFF; --text-2:#8C93A1;
  --asia:#F2683C; --europe:#5AA9E6; --africa:#F4C145;
  --oceania:#3FC79A; --na:#C879E0; --sa:#86D957; --ant:#3A3F49;
  --font-kr:'Pretendard Variable','Pretendard','Montserrat',system-ui,sans-serif;
  --font-en:'Montserrat','Pretendard Variable',sans-serif;
  --font-sig:'Covered By Your Grace',cursive;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-kr);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* Top bar */
.topbar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;pointer-events:none}
.title-wrap{pointer-events:auto}
.kicker{font-family:var(--font-en);font-size:10px;letter-spacing:.28em;color:var(--ps-primary);font-weight:600;text-transform:uppercase}
.title{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-top:3px}
.title .en{font-family:var(--font-en);color:var(--text-2);font-weight:300;font-size:13px;margin-left:8px;letter-spacing:.02em}

/* Map */
#stage{flex:1;position:relative;cursor:grab;touch-action:none}
#stage.dragging{cursor:grabbing}
#map{display:block;width:100%;height:100%}
.land{stroke:#04060B;stroke-width:.4;transition:opacity .25s var(--ease),filter .25s var(--ease)}
.land.dim{opacity:.28}
.land.active{stroke:var(--ps-primary);stroke-width:1.1;filter:drop-shadow(0 0 7px rgba(255,177,26,.55))}
.grat{fill:none;stroke:#FFFFFF;stroke-width:.6;opacity:.32;pointer-events:none;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.35))}
.equator{fill:none;stroke:#FF7B7B;stroke-width:1.6;opacity:.62;pointer-events:none;
  filter:drop-shadow(0 0 2px rgba(255,123,123,.45))}
.cont-label{font-family:var(--font-kr);font-weight:600;fill:#fff;text-anchor:middle;
  paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round;pointer-events:none;letter-spacing:.02em}
.ocean-label{transition:opacity .25s var(--ease),filter .25s var(--ease)}
.ocean-label .kr{font-family:var(--font-kr);font-weight:300;fill:#9DB0D6;text-anchor:middle;letter-spacing:.18em;font-size:14px;transition:fill .25s var(--ease)}
.ocean-label .en{font-family:var(--font-en);font-weight:300;fill:#56627E;text-anchor:middle;letter-spacing:.32em;font-size:8.5px;text-transform:uppercase;transition:fill .25s var(--ease)}
.ocean-label.dim{opacity:.22}
.ocean-label.active{filter:drop-shadow(0 0 8px rgba(255,177,26,.55))}
.ocean-label.active .kr{fill:var(--ps-primary);font-weight:500}
.ocean-label.active .en{fill:var(--ps-primary)}
.ocean-fill{pointer-events:none;opacity:0;transition:opacity .3s var(--ease);
  filter:drop-shadow(0 0 10px rgba(120,180,230,.4))}
.ocean-fill.show{opacity:.55}
.prime{fill:none;stroke:#FFB270;stroke-width:1.4;opacity:.6;pointer-events:none;
  filter:drop-shadow(0 0 2px rgba(255,178,112,.45))}

/* Legend */
.legend{position:absolute;left:22px;bottom:54px;z-index:30;display:flex;flex-direction:column;gap:9px;
  background:rgba(16,19,25,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:16px;padding:14px 16px;max-width:340px}
.legend-cols{display:flex;flex-direction:row;gap:16px;align-items:flex-start}
.legend-col{display:flex;flex-direction:column;gap:6px;min-width:96px}
.legend h4{font-family:var(--font-en);font-size:9px;letter-spacing:.22em;color:var(--text-2);font-weight:600;text-transform:uppercase;margin-bottom:3px}
.chip{display:flex;align-items:center;gap:9px;cursor:pointer;border:none;background:none;padding:3px 4px;border-radius:8px;
  width:100%;text-align:left;transition:background .2s}
.chip:hover{background:rgba(255,255,255,.06)}
.chip.on{background:rgba(255,177,26,.12)}
.dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.chip span{font-size:13px;color:var(--text);font-weight:300}
.chip small{font-family:var(--font-en);font-size:9px;color:var(--text-2);margin-left:auto;letter-spacing:.04em}
.legend .note{font-size:10px;color:var(--text-2);line-height:1.45;margin-top:5px;border-top:1px solid var(--border);padding-top:7px}

/* Grid panel (#3) */
.grid-panel{position:absolute;left:22px;top:74px;z-index:30;display:flex;flex-direction:column;gap:7px;
  background:rgba(16,19,25,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:16px;padding:13px 15px;min-width:150px}
.grid-panel h4{font-family:var(--font-en);font-size:9px;letter-spacing:.22em;color:var(--text-2);font-weight:600;text-transform:uppercase;margin-bottom:2px}
.grid-panel .tg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);font-weight:300;cursor:pointer}
.grid-panel .tg input[type=checkbox]{appearance:none;-webkit-appearance:none;width:30px;height:17px;border-radius:9999px;
  background:var(--surface-2);border:1px solid var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.grid-panel .tg input[type=checkbox]::after{content:"";position:absolute;top:1.5px;left:1.5px;width:12px;height:12px;border-radius:50%;
  background:#8C93A1;transition:all .2s}
.grid-panel .tg input[type=checkbox]:checked{background:rgba(255,177,26,.28);border-color:var(--ps-primary)}
.grid-panel .tg input[type=checkbox]:checked::after{left:14px;background:var(--ps-primary)}
.grid-panel .step{display:flex;align-items:center;gap:6px;margin-top:3px;border-top:1px solid var(--border);padding-top:8px}
.grid-panel .step span{font-size:12px;color:var(--text-2);font-weight:300}
.grid-panel .step input[type=number]{width:50px;background:var(--surface-1);border:1px solid var(--border);border-radius:7px;
  color:var(--text);font-family:var(--font-en);font-size:12px;padding:4px 6px;text-align:center}
.grid-panel .step input:focus{outline:none;border-color:var(--ps-primary)}

/* Controls */
.controls{position:absolute;right:22px;bottom:54px;z-index:30;display:flex;flex-direction:column;gap:8px}
.ctrl{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:rgba(16,19,25,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .18s var(--ease);font-family:var(--font-en)}
.ctrl:hover{border-color:var(--ps-primary);color:var(--ps-primary)}
.ctrl:active{transform:scale(.93)}
.ctrl.home{font-size:15px}

/* Info panel */
.info{position:absolute;top:74px;right:22px;z-index:30;width:248px;
  background:rgba(16,19,25,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:20px;padding:20px;
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:all .3s var(--ease)}
.info.show{opacity:1;transform:translateY(0)}
.info .swatch{width:34px;height:34px;border-radius:9px;margin-bottom:12px}
.info .en{font-family:var(--font-en);font-size:10px;letter-spacing:.22em;color:var(--text-2);font-weight:600;text-transform:uppercase}
.info .kr{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.info .fact{font-size:13px;line-height:1.6;color:#C5CAD4;font-weight:300}

/* hint */
.hint{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);z-index:25;
  font-size:11px;color:var(--text-2);font-weight:300;letter-spacing:.02em;text-align:center;
  background:rgba(4,6,11,.5);padding:6px 14px;border-radius:9999px;transition:opacity .4s}
.projseg{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:2px;
  padding:3px;border-radius:12px;border:1px solid var(--border);background:rgba(16,19,25,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.projseg button{border:0;background:transparent;color:var(--text-2);font-family:var(--font-kr);font-size:12px;
  font-weight:500;padding:6px 13px;border-radius:9px;cursor:pointer;transition:all .18s var(--ease);white-space:nowrap}
.projseg button:hover{color:#fff}
.projseg button.on{background:var(--ps-primary);color:#0A0C10;font-weight:600}
.sphere{pointer-events:none}
.watermark{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);z-index:5;
  font-family:var(--font-en);font-size:9px;letter-spacing:.4em;color:#323a4a;text-transform:uppercase;pointer-events:none}

/* Footer (parcyun mandatory) */
.ps-footer{position:fixed;bottom:14px;right:20px;font-family:var(--font-en);font-weight:300;font-size:8pt;
  color:var(--text-2);display:flex;align-items:center;gap:8px;z-index:9999}
.ps-signature{font-family:var(--font-sig);font-size:11pt;color:var(--ps-primary)}
.ps-ig{display:inline-flex;align-items:center;gap:3px;color:inherit;text-decoration:none}
.ps-ig:hover{color:var(--ps-primary)}

@media(max-width:640px){
  .info{width:200px;padding:16px} .info .kr{font-size:24px}
  .legend{max-width:160px;padding:11px 13px;bottom:48px;left:14px}
  .controls{right:14px;bottom:48px} .topbar{padding:14px 16px}
  .title{font-size:16px} .title .en{display:none}
}

/* ── parcyun.github.io 통합: 공용 위젯이 지도 UI와 안 겹치게 배치 ── */
.controls{bottom:118px}                              /* 줌 컨트롤 위로 → 공유FAB 자리 확보 */
.ps-share-fab{bottom:62px!important}                 /* 우하단: 컨트롤 아래·푸터 위 */
.ps-visits-float{left:50%!important;transform:translateX(-50%);bottom:14px!important;
  right:auto!important}                               /* 방문자수 하단 중앙(범례와 안 겹침) */
@media(max-width:520px){.controls{bottom:96px}.ps-share-fab{bottom:56px!important}}
</style>
</head>

<div id="app">
  <div class="topbar">
    <div class="title-wrap">
      <div class="kicker">World Map · Interactive</div>
      <div class="title">세계 지도<span class="en">6대륙 5대양</span></div>
    </div>

  <div id="stage">
    <svg id="map"></svg>
  </div>

  <div class="info" id="info">
    <div class="swatch" id="info-sw"></div>

    <div class="kr" id="info-kr"></div>
    <div class="fact" id="info-fact"></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="grid-panel" id="gridPanel">

  </div>

  <div class="projseg" id="projseg">
    <button data-mode="flat" class="on">평면</button>
    <button data-mode="lens">Focus Lens</button>
    <button data-mode="globe">지구본</button>
    <button data-mode="daynight">낮과 밤</button>
  </div>

  <div class="controls">
    <button class="ctrl" id="zin" aria-label="확대">+</button>
    <button class="ctrl" id="zout" aria-label="축소">−</button>

  <div class="watermark" id="watermark">Mercator Projection</div>
</div>

    const k=0.28; lambda+=dx*k; phi=Math.max(-89,Math.min(89,phi-dy*k));
  }
  lambda=((lambda+180)%360+360)%360-180;
  schedule();
});
// 대양 영역 클릭 분류(#1/v14). 실제 대양 폴리곤(OCEANS_GEO)에 d3.geoContains → 클릭한 물
// 지점이 어느 대양 fill에 속하는지 정확히 일치. 어디에도 안 들면 null(내륙해·빈틈=선택 안 함).
// containsOcean: MultiPolygon 전체를 한 번에 d3.geoContains 테스트하면 근접-극·다중구멍
// 케이스(남극해 61~76개 구멍)에서 d3-geo가 오판한다(실측 확인) — part(단일 Polygon)별로
// 개별 테스트 후 OR 해야 정확하다. 데이터 자체(gen_oceans.py 원본)는 이미 올바르게
// 방향이 잡혀 있어 별도 윈딩 교정이 필요 없다.
function containsOcean(g,pt){
  const polys = g.type==='Polygon' ? [g.coordinates] : g.coordinates;
  return polys.some(rings=>d3.geoContains({type:'Polygon',coordinates:rings},pt));
}
function oceanAt(lon,lat){
  for(const k of ['southern','arctic','indian','atlantic','pacific']){
    if(containsOcean(OCEANS_GEO[k],[lon,lat])) return k;
  }
  return null;
}
// 탭(거의 안 움직인 pointerup) = 선택. click 대신 elementFromPoint로 대상을 직접 찾는다.
function featureAt(lon,lat){ for(const f of WORLD.features){ if(d3.geoContains(f.geometry,[lon,lat])) return f; } return null; }
// 모핑 프로젝션(interpolated raw)엔 invert가 없다 → 정착 상태를 미러링한 진짜 프로젝션으로 역변환.
function hitProj(){
  const fit=Math.min(W,H)*0.46;
  let b;
  if(projMode==='globe'||projMode==='daynight') b=d3.geoOrthographic().clipAngle(90).scale(fit*globeZoom);
  else if(projMode==='lens') b=d3.geoStereographic().clipAngle(150).scale(fit*0.62*globeZoom);
  else b=d3.geoMercator().scale(scale);
  return b.rotate([lambda, projMode==='flat'?0:phi]).translate([W/2, H/2+(projMode==='flat'?panY:0)]);
}
function handleTap(e){
  const rect=stage.getBoundingClientRect();
  const ll=hitProj().invert([e.clientX-rect.left,e.clientY-rect.top]);
  let d=null;
  if(projMode==='flat'){                                // 평면: DOM 히트테스트(빠름)
    const el=document.elementFromPoint(e.clientX,e.clientY);
    d=(el&&el.classList&&el.classList.contains('land'))?d3.select(el).datum():null;
  }else{ d=ll?featureAt(ll[0],ll[1]):null; }            // 구·렌즈: geoContains(Antarctica DOM 이슈 회피)
  if(d){ countryMode?selectCountry(d):setActive(d.properties.c); return; }
  if(countryMode){ setActive(null); return; }
  setActive(ll?oceanAt(ll[0],ll[1]):null);
}
function endDrag(e){
  dragging=false; stage.classList.remove('dragging');
  if(e&&e.type==='pointerup'&&moved<6) handleTap(e);
  moved=0;
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);

// #2/v15 트랙패드 제스처: 두 손가락 드래그(스크롤)=이동, 핀치(두 손가락 줌)=확대/축소.
// macOS/브라우저는 핀치를 ctrlKey=true인 wheel로 보낸다 → ctrlKey로 분기.
stage.addEventListener('wheel',e=>{
  e.preventDefault(); hideHint();
  // 줌 조건: 핀치(ctrlKey) 또는 PC 마우스 휠(가로성분 0 + 큰 수직 델타). 트랙패드 두 손가락
  // 스크롤(작은 델타/가로성분 있음)은 이동/회전으로 분기.
  const isPinch=e.ctrlKey, isWheel=!isPinch&&e.deltaX===0&&Math.abs(e.deltaY)>=30;
  if(isPinch||isWheel){
    const f=isPinch?Math.exp(-e.deltaY*0.01):(e.deltaY<0?1.2:1/1.2);
    if(projMode==='flat'){ scale*=f; clampScale(); } else { globeZoom*=f; clampGlobeZoom(); }
    schedule();
  }else{                                           // 트랙패드 두 손가락 스크롤 = 이동/회전
    if(projMode==='flat'){
      const degPerPx=180/(Math.PI*scale); lambda-=e.deltaX*degPerPx; panY-=e.deltaY;
    }else{
      const k=0.28; lambda-=e.deltaX*k; phi=Math.max(-89,Math.min(89,phi+e.deltaY*k));
    }
    lambda=((lambda+180)%360+360)%360-180;
    schedule();
  }
},{passive:false});

document.getElementById('zin').onclick=()=>{ if(projMode==='flat'){scale*=1.25;clampScale();}else{globeZoom*=1.25;clampGlobeZoom();} schedule();};
document.getElementById('zout').onclick=()=>{ if(projMode==='flat'){scale/=1.25;clampScale();}else{globeZoom/=1.25;clampGlobeZoom();} schedule();};
document.getElementById('home').onclick=()=>{lambda=0;panY=0;phi=0;scale=baseScale;globeZoom=1;setActive(null);setMode('flat');schedule();};
// #P2/v19 도법 토글: 평면(α0)/렌즈·지구본(α1). 전환은 항상 평면을 경유해 부드럽게 모핑.
let animRAF=null;
function animateAlpha(to,done){
  if(animRAF)cancelAnimationFrame(animRAF);
  const from=alpha,t0=performance.now(),dur=850;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur),e=d3.easeCubicInOut(k);
    alpha=from+(to-from)*e; render();
    if(k<1)animRAF=requestAnimationFrame(step);else{animRAF=null;alpha=to;render();if(done)done();}
  })(performance.now());
}
// #낮밤/v23: 태양은 화면에 고정, 지구가 자전 → 밤 반구(반태양점)를 뷰 좌표에 고정하고
// 회전 역변환으로 지리좌표를 구한다. 자전(lambda↑)해도 밤은 화면에 머물고 대륙이 통과한다.
const SUN_VIEW=[-72,-12];  // 뷰상 밤 반구 중심(좌·약간아래) — 태양은 우상단에서 비춤
function nightGeo(){ const anti=d3.geoRotation(proj.rotate()).invert(SUN_VIEW);
  return d3.geoCircle().center(anti).radius(90)(); }
let spinRAF=null,spinPrev=0;
function startSpin(){ if(spinRAF)return; spinPrev=performance.now(); spinRAF=requestAnimationFrame(spinTick); }
function stopSpin(){ if(spinRAF){cancelAnimationFrame(spinRAF); spinRAF=null;} }
function spinTick(now){ const dt=Math.min(60,now-spinPrev); spinPrev=now;
  if(!dragging){ lambda=((lambda+8*dt/1000+180)%360+360)%360-180; }  // 8°/s 천천히 자전
  render(); spinRAF = projMode==='daynight' ? requestAnimationFrame(spinTick) : null; }
function setMode(m){
  document.getElementById('projseg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  const _wm=document.getElementById('watermark'); if(_wm)_wm.textContent={flat:'Mercator Projection',lens:'Focus Lens View',globe:'Orthographic Globe',daynight:'Day & Night · Rotating'}[m];
  if(projMode==='daynight'&&m!=='daynight') stopSpin();  // 낮밤 벗어나면 자전 정지
  if(m==='flat'){ if(alpha===0){projMode='flat';return;} animateAlpha(0,()=>{projMode='flat';}); return; }
  const go=()=>{ targetRaw=TARGET_RAW[m]; buildProj(); projMode=m; animateAlpha(1, m==='daynight'?startSpin:null); };
  if(alpha>0.001) animateAlpha(0,go); else go();
}
document.getElementById('projseg').querySelectorAll('button').forEach(b=>{ b.onclick=()=>setMode(b.dataset.mode); });

// #2/v11: 확대 상한 9→60배(도시국가·소도서까지 렌더링되도록). 벡터라 고배율도 부담 적음.
function clampScale(){scale=Math.max(baseScale,Math.min(scale,baseScale*60));}
function clampGlobeZoom(){globeZoom=Math.max(0.7,Math.min(globeZoom,8));}  // 구·렌즈 줌 범위

function setActive(c){
  active=(active===c)?null:c;
  activeCountry=null;   // 대륙/대양 선택 시 국가 선택 초기화(#4)
  const ocean=!!active&&isOcean(active);
  // 대륙 active면 해당만 강조+나머지 dim. 대양 active면 땅은 그대로 두고(화면 쉐도우 방지) 바다만 fill로 강조.
  lands.classed('active',d=>!ocean&&active&&d.properties.c===active)
       .classed('dim',d=>!!active&&!ocean&&d.properties.c!==active);
  // 대양 라벨: 대양 active면 해당 라벨 글로우, 나머지 대양 라벨 dim.
  oc.classed('active',d=>ocean&&d.o===active)
    .classed('dim',d=>ocean&&d.o!==active);
  // 대양 영역 fill: active 대양의 해역 폴리곤을 ocean 색으로 채움(#1).
  activeOceanGeo=ocean?OCEANS_GEO[active]:null;
  gOceanFill.classed('show',ocean).style('fill',ocean?OCEAN_COLORS[active]:null);
  d3.selectAll('.chip').classed('on',function(){return this.dataset.c===active;});
  const info=document.getElementById('info');
  if(active){
    const COL=ocean?OCEAN_COLORS:COLORS, K=ocean?OCEAN_KR:KR, E=ocean?OCEAN_EN:EN, F=ocean?OCEAN_FACT:FACT;
    info.classList.add('show');
    document.getElementById('info-sw').style.background=COL[active];
    document.getElementById('info-en').textContent=E[active];
    document.getElementById('info-kr').textContent=K[active];
    document.getElementById('info-fact').textContent=F[active];
  }else info.classList.remove('show');
  schedule();  // 대양 fill geometry(d)는 render()에서 갱신되므로 클릭 시 반드시 렌더 트리거
}

// #4 국가별 선택(스캐폴드). countryMode=true 일 때만 동작. 같은 나라(분할된 러시아 등)는 함께 강조.
function selectCountry(d){
  const n=d.properties.n||null;
  activeCountry=(activeCountry===n)?null:n;
  active=null; activeOceanGeo=null;
  gOceanFill.classed('show',false);
  oc.classed('active',false).classed('dim',false);
  d3.selectAll('.chip').classed('on',false);
  lands.classed('active',x=>activeCountry&&x.properties.n===activeCountry)
       .classed('dim',x=>activeCountry&&x.properties.n!==activeCountry);
  const info=document.getElementById('info');
  if(activeCountry){
    info.classList.add('show');
    document.getElementById('info-sw').style.background=COLORS[d.properties.c];
    document.getElementById('info-en').textContent=activeCountry;
    document.getElementById('info-kr').textContent=activeCountry;
    document.getElementById('info-fact').textContent=KR[d.properties.c]+' 대륙';
  }else info.classList.remove('show');
  schedule();
}

let raf=null;
function schedule(){ if(!raf) raf=requestAnimationFrame(()=>{raf=null;render();}); }

function render(){
  if(alpha<0.01){                        // 평면: 세로 팬 클램프(구/렌즈 불필요)
    const halfH=scale*Math.log(Math.tan(Math.PI/4+(84*Math.PI/180)/2));
    if(halfH<=H/2){ panY=0; } else { const m=halfH-H/2; panY=Math.max(-m,Math.min(m,panY)); }
  }
  applyProj();
  gOceanBg.style('opacity',1-alpha);
  gSphere.attr('d',alpha>0.001?path({type:'Sphere'}):null).style('opacity',alpha);
  const _od=activeOceanGeo?path(activeOceanGeo):null;
  gOceanFill.attr('d',_od); oceanMaskPath.attr('d',_od);  // 페더 마스크도 동일 형상
  antFeat.geometry = alpha>0.01?antSafe:antFlat;   // 모드별 Antarctica(평면=클램프,구·렌즈=채움제거)
  lands.attr('d',path);
  gGrat.attr('d',showGrat?path(grat()):null);
  gEq.attr('d',showEq?path(equatorLine):null);
  gPrime.attr('d',showPrime?path(primeLine):null);
  gNight.attr('d', (projMode==='daynight'&&alpha>0.5)?path(nightGeo()):null).style('opacity',(projMode==='daynight'?0.6:0)*alpha);

  // labels
  const rot=proj.rotate(), center=[-rot[0],-rot[1]];
  const vis=ll=>alpha<0.5||d3.geoDistance(center,ll)<(projMode==='globe'?1.55:2.6);
  co.attr('transform',d=>{if(!vis(d.ll))return'translate(-9999,0)';const p=proj(d.ll);if(!p)return'translate(-9999,0)';
    return (p[0]<-40||p[0]>W+40||p[1]<-20||p[1]>H+20)?'translate(-9999,0)':`translate(${p[0]},${p[1]})`;});
  oc.attr('transform',d=>{if(!vis(d.ll))return'translate(-9999,0)';const p=proj(d.ll);if(!p)return'translate(-9999,0)';
    return (p[0]<-30||p[0]>W+30||p[1]<-10||p[1]>H+10)?'translate(-9999,0)':`translate(${p[0]},${p[1]})`;});
}

function resize(){
  W=stage.clientWidth; H=stage.clientHeight;
  svg.attr('width',W).attr('height',H);
  gOceanBg.attr('width',W).attr('height',H);
  const newBase=W/(2*Math.PI);
  if(scale<=baseScale*1.0001||scale===1){scale=newBase;}
  baseScale=newBase; clampScale(); render();
}

// legend build — 대륙/대양 2열 나란히(#1)
const lg=document.getElementById('legend');
function addChip(col,c,COL,K,E){
  const b=document.createElement('button');b.className='chip';b.dataset.c=c;
  b.innerHTML=`<span class="dot" style="background:${COL[c]}"></span><span>${K[c]}</span><small>${E[c].split(' ')[0]}</small>`;
  b.onclick=()=>setActive(c); col.appendChild(b);
}
const cols=document.createElement('div');cols.className='legend-cols';lg.appendChild(cols);
const colC=document.createElement('div');colC.className='legend-col';
const colO=document.createElement('div');colO.className='legend-col';
cols.appendChild(colC);cols.appendChild(colO);
const hC=document.createElement('h4');hC.textContent='6 Continents';colC.appendChild(hC);
ORDER.forEach(c=>addChip(colC,c,COLORS,KR,EN));
const hO=document.createElement('h4');hO.textContent='5 Oceans';colO.appendChild(hO);
OCEAN_ORDER.forEach(c=>addChip(colO,c,OCEAN_COLORS,OCEAN_KR,OCEAN_EN));
const note=document.createElement('div');note.className='note';
note.innerHTML='남극(Antarctica)은 6대륙에서 제외';
lg.appendChild(note);

// 격자 컨트롤 (#3)
document.getElementById('tgGrat').onchange=e=>{showGrat=e.target.checked;schedule();};
document.getElementById('tgEq').onchange=e=>{showEq=e.target.checked;schedule();};
document.getElementById('tgPrime').onchange=e=>{showPrime=e.target.checked;schedule();};
document.getElementById('inStep').oninput=e=>{
  let v=Math.round(+e.target.value);if(!v)return;
  v=Math.max(5,Math.min(90,v));gratStep=v;grat.step([v,v]);schedule();
};
// 국가 선택 모드 토글 (#4, 기본 off). 전환 시 현재 선택 초기화.
document.getElementById('tgCountry').onchange=e=>{countryMode=e.target.checked;activeCountry=null;setActive(null);};

let hintTimer=setTimeout(hideHint,7000);
function hideHint(){const h=document.getElementById('hint');if(h){h.style.opacity='0';clearTimeout(hintTimer);setTimeout(()=>h.remove(),500);}}

window.addEventListener('resize',resize);
scale=1; resize();
</script>
